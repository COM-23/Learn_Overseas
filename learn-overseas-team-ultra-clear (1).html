<style>

}to{transform:translate3d(-.6%,-.25%,0)}}@keyframes starTwinkle{from{opacity:.45}to{opacity:.9}}

/* Tail-origin transition: reveal the employee page from the aircraft tail side. */
.team{position:relative;z-index:1}
.intro{z-index:20;clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0);transition:clip-path 1.05s cubic-bezier(.2,.72,.16,1),-webkit-clip-path 1.05s cubic-bezier(.2,.72,.16,1),opacity .15s linear}

</style>

  to{transform:translate3d(10%,-2%,0) scale(1.10)}
}
@keyframes cloudFar{
  from{transform:translate3d(7%,1%,0) scale(1.08)}
  to{transform:translate3d(-7%,-1%,0) scale(1.14)}
}

/* Keep the sky behind the aircraft and UI */
.intro .brand,
.intro .skip,
.intro .plane-wrap,
.intro .wash{z-index:4 !important;}

/* Fabric banner attached to the aircraft tail */
.tail-banner{
  position:absolute;
  left:12%;
  top:42%;
  width:220px;
  height:70px;
  z-index:5;
  pointer-events:none;
  transform:translateX(-78%) rotate(-1deg);
  transform-origin:right center;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));
}
.banner-line{
  position:absolute;
  right:0;
  top:50%;
  width:18px;
  height:2px;
  background:linear-gradient(90deg,rgba(230,238,250,.15),rgba(255,255,255,.82));
  box-shadow:0 0 5px rgba(255,255,255,.35);
  transform:translateY(-50%);
}
.banner-flag{
  position:absolute;
  right:20px;
  top:50%;
  width:320px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 10px;
  color:#fff;
  font:900 22px/1 Arial,Helvetica,sans-serif; letter-spacing:.02em; text-shadow:0 1px 2px rgba(0,0,0,.4);
  letter-spacing:.08em;
  white-space:nowrap;
  background:linear-gradient(180deg,#f26a18 0%,#dc4e08 100%);
  clip-path:polygon(0 0,100% 7%,92% 50%,100% 93%,0 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.25);
  animation:flagWave 1.15s ease-in-out infinite alternate;
  transform-origin:right center;
}
@keyframes flagWave{
  from{transform:skewY(-2deg) rotate(-1deg)}
  to{transform:skewY(3deg) rotate(1.5deg)}
}
@media(max-width:700px){
  .banner-flag{width:120px;height:42px;font-size:11px}
  .tail-banner{width:165px}
}
</style>
<style id="random-starfield">
/* Randomly placed stars (JS-generated) — replaces the old fixed grid pattern */
.intro .starLayer{
  position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;
}
.intro .starLayer .star{
  position:absolute; border-radius:50%;
  background:#fff;
  box-shadow:0 0 3px rgba(255,255,255,.8);
  opacity:.6;
  --tw-min:.15; --tw-max:.9;
  animation-name:twinkle;
  animation-iteration-count:infinite;
  animation-timing-function:ease-in-out;
}
@keyframes twinkle{
  0%{opacity:var(--tw-min)}
  50%{opacity:var(--tw-max)}
  100%{opacity:var(--tw-min)}
}
.intro .starLayer .nebula{
  position:absolute; border-radius:50%;
  filter:blur(60px);
  opacity:.5;
  transform:translate(-50%,-50%);
}
</style>
<style id="clouds-removed-final">
/* Clouds and white cloud-patch layers removed per request. */
.clouds,
.clouds:before,
.clouds:after,
.intro .clouds,
.intro .clouds:before,
.intro .clouds:after,
.cloud-video{
  display:none !important;
  content:none !important;
  background:none !important;
}
</style>

<section class="team"><nav class="team-nav"><div class="logo">LEARN <span>OVERSEAS</span></div><button class="replay" id="replay">↺ REPLAY INTRO</button></nav><section class="hero"><div class="eyebrow">The Team</div><h1>The people behind every boarding pass</h1><p>Meet the people behind Learn Overseas — counselors, admissions specialists and student-success experts helping students take their next step.</p></section><div class="roster" id="roster"></div><footer>Built for <b>LEARN OVERSEAS</b> · Where global minds take flight</footer></section>
<script>
// ---------------------------------------------------------------
// TEAM DATA — swap in real names, roles, bios and photos any time.
// To use a real photo instead of the illustrated avatar, replace
// the <svg> inside .avatar with <img src="path/to/photo.jpg">.
// ---------------------------------------------------------------
const team = [
  { name:"Ananya Rao", role:"Founder & Lead Counselor", dept:"USA · UK", tone:"orange",
    bio:"Started Learn Overseas after her own MS application in 2016. Still personally reviews every SOP that goes out the door." },
  { name:"Devansh Mehta", role:"Head of Admissions", dept:"Canada · Australia", tone:"teal",
    bio:"Ex-university admissions reader. Knows exactly what makes a file get a second look — and what gets it rejected." },
  { name:"Priya Nair", role:"Visa & Documentation Lead", dept:"All Regions", tone:"blue",
    bio:"Has filed over 1,200 study-visa applications without a single missed deadline. The calmest person in any embassy queue." },
  { name:"Rohan Iyer", role:"Counselor, Europe", dept:"Germany · France · Ireland", tone:"yellow",
    bio:"Studied in Munich on a tuition-free public university seat and has been evangelizing the route ever since." },
  { name:"Sana Sheikh", role:"Scholarships Advisor", dept:"All Regions", tone:"teal",
    bio:"Tracks over 300 scholarship and assistantship deadlines in a spreadsheet students still ask to be added to." },
  { name:"Aarav Kapoor", role:"Counselor, Asia Pacific", dept:"Singapore · Japan · S. Korea", tone:"orange",
    bio:"Speaks conversational Japanese and Korean — picked up while helping students settle into their first semester abroad." },
  { name:"Meera Krishnan", role:"Student Success Manager", dept:"Post-Departure", tone:"blue",
    bio:"The person students message from the airport. Runs the WhatsApp group that outlives most friend groups." },
  { name:"Kabir Singh", role:"Finance & Fee Planning", dept:"All Regions", tone:"yellow",
    bio:"Builds the real cost-of-living numbers behind every country page — no rounded-up guesses, ever." }
];

const toneVars = {
  orange:"var(--orange)", teal:"var(--teal)", blue:"var(--blue)", yellow:"var(--yellow)"
};

function initials(name){
  return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function avatarSVG(name, tone){
  const c = toneVars[tone] || toneVars.orange;
  const ini = initials(name);
  return `
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-${ini}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c}" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#0a0d12"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" fill="url(#g-${ini})"/>
    <circle cx="50" cy="40" r="18" fill="rgba(255,255,255,.16)"/>
    <path d="M18 92 C18 66, 34 56, 50 56 C66 56, 82 66, 82 92 Z" fill="rgba(255,255,255,.13)"/>
    <text x="50" y="47" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" fill="#fff" font-weight="600">${ini}</text>
  </svg>`;
}

const rosterEl = document.getElementById('roster');
team.forEach((m, i) => {
  const card = document.createElement('div');
  card.className = 'pass';
  card.innerHTML = `
    <div class="pass-stub">
      <div class="avatar">${avatarSVG(m.name, m.tone)}</div>
    </div>
    <div class="pass-body">
      <div>
        <h3 class="pass-name">${m.name}</h3>
        <div class="pass-role">${m.role}</div>
      </div>
      <p class="pass-bio">${m.bio}</p>
      <div class="pass-meta">
        <span>DEPT ${m.dept}</span>
        <span>SEAT ${String(i+1).padStart(2,'0')}A</span>
      </div>
    </div>
  `;
  rosterEl.appendChild(card);
});

// ---------------------------------------------------------------
// STARFIELD (DOM layer) — twinkling points + soft nebula blobs,
// sits behind the WebGL canvas for extra depth at zero GPU cost.
// ---------------------------------------------------------------
(function buildStars(){
  const host = document.getElementById('starLayer');
  const frag = document.createDocumentFragment();
  for(let i=0;i<180;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.85 ? (0.7 + Math.random()*1.3) : (1.6 + Math.random()*1.6);
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'%';
    s.style.top = (Math.random()*100)+'%';
    s.style.setProperty('--tw-min', (0.1 + Math.random()*0.18).toFixed(2));
    s.style.setProperty('--tw-max', (0.65 + Math.random()*0.35).toFixed(2));
    const dur = 2 + Math.random()*4;
    s.style.animation = `twinkle ${dur}s ease-in-out ${-Math.random()*dur}s infinite`;
    frag.appendChild(s);
  }
  const nebulaSpecs = [
    { top:'8%',  left:'72%', size:460, color:'rgba(40,70,160,.45)' },
    { top:'62%', left:'6%',  size:360, color:'rgba(90,50,150,.30)' },
    { top:'78%', left:'78%', size:320, color:'rgba(30,110,140,.28)' }
  ];
  nebulaSpecs.forEach(n => {
    const el = document.createElement('div');
    el.className = 'nebula';
    el.style.top = n.top; el.style.left = n.left;
    el.style.width = n.size+'px'; el.style.height = n.size+'px';
    el.style.background = n.color;
    host.appendChild(el);
  });
  host.appendChild(frag);
})();

// ---------------------------------------------------------------
// INTRO TIMELINE CONTROL — delegates the actual flight animation
// to window.FlightScene (WebGL), set up in the module script above.
// ---------------------------------------------------------------
const introStage = document.getElementById('introStage');
const introCopy = document.getElementById('introCopy');
const skipBtn = document.getElementById('skipBtn');
const replayBtn = document.getElementById('replayBtn');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function finishIntro(){
  introStage.classList.add('closing');
  introStage.addEventListener('transitionend', () => {
    introStage.classList.add('hidden');
    document.body.classList.remove('intro-lock');
    if (window.FlightScene && window.FlightScene.stop) window.FlightScene.stop();
  }, { once:true });
}

function skipIntro(){
  if (window.FlightScene && window.FlightScene.stop) window.FlightScene.stop();
  finishIntro();
}

function playIntro(){
  document.body.classList.add('intro-lock');
  introStage.classList.remove('hidden');
  void introStage.offsetWidth;
  introStage.classList.remove('closing');
  introCopy.classList.remove('faded');

  const scene = window.FlightScene;
  if (reduceMotion || !scene || !scene.ready){
    setTimeout(finishIntro, reduceMotion ? 300 : 1400);
    return;
  }
  setTimeout(() => introCopy.classList.add('faded'), 1700);
  scene.play(finishIntro);
}

skipBtn.addEventListener('click', skipIntro);
replayBtn.addEventListener('click', playIntro);

function boot(){
  if (reduceMotion){
    setTimeout(finishIntro, 400);
    return;
  }
  let started = false;
  const go = () => { if (started) return; started = true; setTimeout(playIntro, 250); };
  if (window.FlightScene && window.FlightScene.ready){
    go();
  } else {
    window.addEventListener('flightSceneReady', go, { once:true });
    setTimeout(go, 4000); // fail-safe if assets are slow/unavailable
  }
}
window.addEventListener('load', boot);
</script>
<script>
const intro=document.getElementById('intro'), skip=document.getElementById('skip'), replay=document.getElementById('replay');
function finish(){document.body.classList.add('show-team'); let sweep=document.getElementById('tailTransition'); if(!sweep){sweep=document.createElement('div');sweep.id='tailTransition';document.body.appendChild(sweep)} sweep.classList.remove('active'); void sweep.offsetWidth; sweep.classList.add('active'); intro.classList.remove('transition'); intro.classList.add('tail-transition'); setTimeout(()=>{intro.classList.add('done');document.body.classList.remove('intro-lock')},1100)}
function play(){document.body.classList.add('intro-lock');document.body.classList.remove('show-team');intro.classList.remove('done','transition','tail-transition'); document.getElementById('tailTransition')?.classList.remove('active');void intro.offsetWidth;document.getElementById('plane').style.animation='none';void document.getElementById('plane').offsetWidth;document.getElementById('plane').style.animation='fly 6.3s linear forwards';setTimeout(finish,5900)}
skip.onclick=finish; replay.onclick=play; setTimeout(play,0);

</script>
</body></html>
